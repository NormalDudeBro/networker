name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore networker.sln

      - name: Run Core tests
        run: dotnet test Networker.Core.Tests\Networker.Core.Tests.csproj -c Debug --no-restore

      - name: Run updater tests
        run: dotnet test Networker.Update.Tests\Networker.Update.Tests.csproj -c Debug --no-restore

      - name: Build Debug x64
        run: dotnet build networker.csproj -c Debug -p:Platform=x64 --no-restore

      - name: Build launcher boundary
        shell: pwsh
        run: |
          dotnet build Networker.Launcher\Networker.Launcher.csproj -c Debug -p:Platform=x64 --no-restore
          dotnet build Networker.UpdateHost\Networker.UpdateHost.csproj -c Debug --no-restore
          dotnet build Networker.Bootstrap\Networker.Bootstrap.csproj -c Debug --no-restore

      - name: Publish Release x64
        run: dotnet publish networker.csproj -c Release -p:Platform=x64 -p:WindowsPackageType=None --no-restore
